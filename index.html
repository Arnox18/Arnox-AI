<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure AI</title>
    <!-- Marked.js für schöne Formatierung (Markdown/Code) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-input: #2f2f2f;
            --bg-msg-user: #2f2f2f;
            --text-primary: #ececf1;
            --text-secondary: #b4b4b4;
            --accent-azure: #0078d4;
            --border-color: #424242;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Layout */
        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 12px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .new-chat-btn:hover { background-color: #212121; }

        /* Main Workspace */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header h1 { font-size: 1.1rem; font-weight: 600; }

        #api-key-input {
            width: 260px;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
        }

        /* Chat Display */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 160px 0;
        }

        .message-row {
            padding: 18px 24px;
            display: flex;
            justify-content: center;
        }

        .message-row.user { background-color: transparent; }
        .message-row.bot { background-color: rgba(255,255,255,0.02); }

        .message-content {
            max-width: 768px;
            width: 100%;
            display: flex;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user .avatar { background-color: #5436da; color: #fff; }
        .bot .avatar { background-color: var(--accent-azure); color: #fff; }

        .message-text {
            flex: 1;
            line-height: 1.6;
            font-size: 0.98rem;
            overflow-x: auto;
        }

        .message-text p { margin-bottom: 0.8em; }
        .message-text pre {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .message-text code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }

        .preview-img {
            max-width: 250px;
            max-height: 250px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
        }

        /* Input Container */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-main) 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #input-box {
            max-width: 768px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            resize: none;
            max-height: 150px;
            outline: none;
            font-family: inherit;
        }

        .upload-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        #send-btn {
            background: var(--border-color);
            border: none;
            color: var(--bg-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        #send-btn.active {
            background: #fff;
            color: #000;
        }

        #image-preview-bar {
            max-width: 768px;
            width: 100%;
            margin-bottom: 8px;
            display: none;
        }

        #image-preview-bar img {
            height: 60px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ Neuer Chat</button>
    </div>

    <div id="main-chat">
        <header>
            <h1>Azure AI</h1>
            <input type="password" id="api-key-input" placeholder="OpenAI API Key (sk-...)">
        </header>

        <div id="chat-box">
            <div class="message-row bot">
                <div class="message-content">
                    <div class="avatar">A</div>
                    <div class="message-text">Hallo! Ich bin Azure. Wie kann ich dir heute helfen?</div>
                </div>
            </div>
        </div>

        <div id="input-area">
            <div id="image-preview-bar">
                <img id="uploaded-img-preview" src="" alt="Preview">
            </div>

            <div id="input-box">
                <!-- Versteckter File Upload -->
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                
                <!-- Plus Button -->
                <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Bild hochladen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>

                <textarea id="user-input" rows="1" placeholder="Nachricht an Azure..."></textarea>

                <button id="send-btn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
