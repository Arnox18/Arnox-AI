<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnox AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-sidebar: #11131a;
            --bg-card: #181b24;
            --bg-card-hover: #222634;
            --bg-input: #151821;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 18px;
            border-right: 1px solid var(--border);
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--border-hover);
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }

        /* --- Hauptbereich --- */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 10, 15, 0.7);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .model-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        #api-key-input {
            width: 260px;
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }

        #api-key-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- Hero Center --- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        #hero-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            max-width: 840px;
            width: 100%;
        }

        .hero-icon {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 24px;
            box-shadow: 0 12px 36px var(--accent-glow);
        }

        #hero-welcome h2 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #hero-welcome p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 40px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .suggestion-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }

        .suggestion-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .suggestion-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* --- Nachrichten --- */
        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 28px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .message-row.bot {
            background: rgba(255, 255, 255, 0.015);
        }

        .message-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 20px;
            padding: 0 24px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .user .avatar { background: #2563eb; color: #fff; }
        .bot .avatar { background: linear-gradient(135deg, #8b5cf6, #d946ef); color: #fff; }

        .message-text {
            flex: 1;
            line-height: 1.7;
            font-size: 1rem;
            color: #e2e8f0;
        }

        .message-text pre {
            background: #050608;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin: 16px 0;
        }

        /* --- Input Bar --- */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-dark) 45%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #image-preview-bar {
            max-width: 800px;
            width: 100%;
            margin-bottom: 12px;
            display: none;
        }

        #image-preview-bar img {
            height: 70px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }

        #input-box {
            max-width: 800px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-end;
            gap: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }

        #input-box:focus-within {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            max-height: 160px;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .upload-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .upload-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.06); }

        #send-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #send-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <div class="brand-header">
                <div class="brand-logo">A</div>
                <div class="brand-name">Arnox AI</div>
            </div>

            <button class="new-chat-btn" onclick="location.reload()">
                <span>+ Neuer Chat</span>
                <span style="font-size: 0.75rem; color: var(--text-muted);">⌘K</span>
            </button>

            <div class="history-title">Verlauf</div>
            <div class="history-item">Willkommen bei Arnox AI</div>
        </div>

        <div class="sidebar-bottom">
            <div class="user-avatar">U</div>
            <div style="font-weight: 600;">Mein Profil</div>
        </div>
    </div>

    <div id="main-chat">
        <header>
            <div class="model-badge">
                <div class="dot"></div>
                GPT-4o Mini
            </div>
            <input type="password" id="api-key-input" placeholder="OpenAI Key eintragen (sk-...)">
        </header>

        <div id="chat-box">
            <div id="hero-welcome">
                <div class="hero-icon">A</div>
                <h2>Wobei kann ich dir helfen?</h2>
                <p>Nutze Arnox AI für deine täglichen Aufgaben, Code und Fragen.</p>
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="setPrompt('Schreibe ein Discord Bot Skript in Node.js')">
                        <div class="suggestion-title">Discord Bot Skript</div>
                        <div class="suggestion-desc">Erstelle Grundcode für deinen Server</div>
                    </div>
                    <div class="suggestion-card" onclick="setPrompt('Erkläre mir wie ein PC Prozessor genau funktioniert')">
                        <div class="suggestion-title">Hardware-Erklärung</div>
                        <div class="suggestion-desc">Funktionsweise einer CPU verständlich erklärt</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="input-area">
            <div id="image-preview-bar">
                <img id="uploaded-img-preview" src="" alt="Preview">
            </div>

            <div id="input-box">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                
                <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Bild anhängen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>

                <textarea id="user-input" rows="1" placeholder="Nachricht an Arnox AI..."></textarea>

                <button id="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
