<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dqarnox-ai</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2e; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .user { background: #007acc; align-self: flex-end; }
        .bot { background: #333344; align-self: flex-start; }
        #input-container { display: flex; padding: 15px; background: #181825; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #313244; color: #fff; }
        button { padding: 10px 18px; border-radius: 6px; border: none; background: #89b4fa; color: #000; font-weight: bold; cursor: pointer; }
        #api-key-input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; background: #313244; color: #fff; border: none; border-radius: 6px; }
        #settings { padding: 15px; background: #11111b; }
    </style>
</head>
<body>

    <div id="settings">
        <input type="password" id="api-key-input" placeholder="OpenAI API Key hier eintragen...">
    </div>

    <div id="chat-box"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Schreibe eine Nachricht...">
        <button onclick="sendMessage()">Senden</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
