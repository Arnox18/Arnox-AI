<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnox AI</title>
    <!-- Marked.js für Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #0d0e12;
            --bg-sidebar: #13141a;
            --bg-card: #1a1c24;
            --bg-card-hover: #222530;
            --bg-input: #161820;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-purple: #7c3aed;
            --accent-purple-glow: rgba(124, 58, 237, 0.35);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(124, 58, 237, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid var(--border);
            justify-content: space-between;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 0 15px var(--accent-purple-glow);
        }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .history-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .history-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            padding: 0 8px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* --- Hauptfenster --- */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(13, 14, 18, 0.8);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .model-selector {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        #api-key-input {
            width: 240px;
            padding: 7px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.82rem;
            outline: none;
            transition: all 0.2s;
        }

        #api-key-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple-glow);
        }

        /* --- Chatverlauf --- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 160px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        #hero-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px var(--accent-purple-glow);
        }

        #hero-welcome h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        #hero-welcome p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 36px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .suggestion-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .suggestion-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .suggestion-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Nachrichten */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row {
            padding: 24px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            animation: fadeIn 0.25s ease-out forwards;
        }

        .message-row.bot {
            background: rgba(255, 255, 255, 0.015);
        }

        .message-content {
            max-width: 720px;
            width: 100%;
            display: flex;
            gap: 18px;
            padding: 0 20px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .user .avatar { background: #2563eb; color: #fff; }
        .bot .avatar { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; }

        .message-text {
            flex: 1;
            line-height: 1.65;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .message-text pre {
            background: #090a0d;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin: 14px 0;
            font-family: "Fira Code", monospace;
            font-size: 0.88rem;
        }

        .preview-img {
            max-width: 260px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        /* --- Floating Input Bar --- */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px 28px 20px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-main) 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #image-preview-bar {
            max-width: 720px;
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        #image-preview-bar img {
            height: 60px;
            border-radius: 8px;
            border: 2px solid var(--accent-purple);
        }

        #input-box {
            max-width: 720px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #input-box:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 12px 32px var(--accent-purple-glow);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            max-height: 150px;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .upload-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .upload-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }

        #send-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #send-btn.active {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-purple-glow);
        }

        /* Scrollbar */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand-logo">A</div>
                <div class="brand-name">Arnox AI</div>
            </div>

            <button class="new-chat-btn" onclick="location.reload()">
                <span>+ Neuer Chat</span>
                <span style="font-size: 0.75rem; color: var(--text-secondary);">⌘K</span>
            </button>

            <div class="history-section">
                <div class="history-title">Kürzlich</div>
                <div class="history-item">Willkommen bei Arnox AI</div>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="user-avatar">U</div>
            <div style="font-weight: 500;">Benutzer Konto</div>
        </div>
    </div>

    <div id="main-chat">
        <header>
            <div class="model-selector">
                <div class="model-status"></div>
                GPT-4o Mini
            </div>
            <input type="password" id="api-key-input" placeholder="OpenAI Key (sk-...)">
        </header>

        <div id="chat-box">
            <div id="hero-welcome">
                <div class="hero-icon">A</div>
                <h2>Wobei kann ich dir helfen?</h2>
                <p>Nutze Arnox AI für Code, Analysen oder kreative Fragen.</p>
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="setPrompt('Schreibe ein Discord Bot Skript in Node.js')">
                        <div class="suggestion-title">Discord Bot Skript</div>
                        <div class="suggestion-desc">Erstelle Grundcode für deinen Server</div>
                    </div>
                    <div class="suggestion-card" onclick="setPrompt('Erkläre mir wie ein PC Prozessor genau funktioniert')">
                        <div class="suggestion-title">Hardware-Erklärung</div>
                        <div class="suggestion-desc">Funktionsweise einer CPU leicht erklärt</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="input-area">
            <div id="image-preview-bar">
                <img id="uploaded-img-preview" src="" alt="Preview">
            </div>

            <div id="input-box">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                
                <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Bild anhängen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>

                <textarea id="user-input" rows="1" placeholder="Nachricht an Arnox AI..."></textarea>

                <button id="send-btn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
