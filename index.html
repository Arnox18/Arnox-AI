<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnox AI</title>
    <!-- Marked.js für Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #131316;
            --bg-sidebar: #0a0a0c;
            --bg-card: #1c1c21;
            --bg-input: #1e1e24;
            --text-main: #ececef;
            --text-muted: #8e8e99;
            --accent-purple: #7357ff;
            --accent-glow: rgba(115, 87, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 14px;
            border-right: 1px solid var(--border-subtle);
        }

        .new-chat-btn {
            background: #1e1e24;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background: #282830;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* --- Hauptbereich --- */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(19, 19, 22, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--accent-purple), #9e57ff);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
        }

        #api-key-input {
            width: 260px;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        #api-key-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* --- Chatverlauf & Empty State --- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 160px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        #hero-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #hero-welcome.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        .hero-avatar {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-purple), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        #hero-welcome h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #hero-welcome p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            width: 100%;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .suggestion-card:hover {
            background: #24242b;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Nachrichten & Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row {
            padding: 20px 24px;
            display: flex;
            justify-content: center;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .message-row.user { background: transparent; }
        .message-row.bot { background: rgba(255, 255, 255, 0.02); border-y: 1px solid rgba(255, 255, 255, 0.03); }

        .message-content {
            max-width: 768px;
            width: 100%;
            display: flex;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user .avatar { background: #2563eb; color: #fff; }
        .bot .avatar { background: linear-gradient(135deg, var(--accent-purple), #9e57ff); color: #fff; }

        .message-text {
            flex: 1;
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .message-text pre {
            background: #09090b;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            overflow-x: auto;
            margin: 12px 0;
        }

        .preview-img {
            max-width: 250px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* --- Input Box --- */
        #input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-dark) 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #image-preview-bar {
            max-width: 768px;
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        #image-preview-bar img {
            height: 64px;
            border-radius: 8px;
            border: 2px solid var(--accent-purple);
        }

        #input-box {
            max-width: 768px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #input-box:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            resize: none;
            max-height: 160px;
            outline: none;
            font-family: inherit;
        }

        .upload-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .upload-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }

        #send-btn {
            background: #2a2a32;
            border: none;
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        #send-btn.active {
            background: #fff;
            color: #000;
        }

        button, .suggestion-card, input {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Neuer Chat
        </button>
    </div>

    <div id="main-chat">
        <header>
            <div class="brand-title">
                <div class="brand-badge">A</div>
                Arnox AI
            </div>
            <input type="password" id="api-key-input" placeholder="OpenAI API Key (sk-...)">
        </header>

        <div id="chat-box">
            <div id="hero-welcome">
                <div class="hero-avatar">A</div>
                <h2>Wobei kann ich dir helfen?</h2>
                <p>Frag mich etwas, lass dir Code schreiben oder lade ein Bild hoch.</p>
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="setPrompt('Schreibe ein kurzes Skript für einen Discord Bot')">
                        <b>Discord Bot Skript</b><br><span style="color: var(--text-muted); font-size: 0.8rem;">Erstelle Grundcode für deinen Server</span>
                    </div>
                    <div class="suggestion-card" onclick="setPrompt('Erkläre mir wie ein PC Prozessor funktioniert')">
                        <b>Hardware-Erklärung</b><br><span style="color: var(--text-muted); font-size: 0.8rem;">Verstehe die CPU verständlich</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="input-area">
            <div id="image-preview-bar">
                <img id="uploaded-img-preview" src="" alt="Preview">
            </div>

            <div id="input-box">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                
                <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Bild anhängen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>

                <textarea id="user-input" rows="1" placeholder="Nachricht an Arnox AI..."></textarea>

                <button id="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
